name: MLX integration

on:
  pull_request:
  push:
    branches: [main, 'ocasta181/**']

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: 'requirements-mlx*.txt'
      - run: python -m pip install -r requirements-mlx-test.txt
      - run: python -m pytest -m 'not metal' --junitxml=mlx-host-tests.xml
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlx-host-tests
          path: mlx-host-tests.xml
